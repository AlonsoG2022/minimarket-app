spring.application.name=minimarket-api-java
server.port=5214
spring.config.import=optional:file:./config/application-local.properties

spring.datasource.url=${MARKET11_DB_URL}
spring.datasource.username=${MARKET11_DB_USERNAME}
spring.datasource.password=${MARKET11_DB_PASSWORD}
spring.datasource.driver-class-name=${MARKET11_DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

miroo.tenancy.enabled=${MIROO_TENANCY_ENABLED:false}
miroo.tenancy.operational-database-name=${MIROO_OPERATIONAL_DATABASE_NAME:MinimarketDb}
miroo.tenancy.local-host-slug=${MIROO_LOCAL_HOST_SLUG:market11}
miroo.tenancy.core-datasource.url=${MIROO_CORE_DB_URL:}
miroo.tenancy.core-datasource.username=${MIROO_CORE_DB_USERNAME:}
miroo.tenancy.core-datasource.password=${MIROO_CORE_DB_PASSWORD:}
miroo.cors.allowed-origins=${MIROO_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081,http://localhost:8080}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
